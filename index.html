<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Minute Writing</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Public+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #faf8f5;
            --warm-gray: #e8e4df;
            --soft-brown: #8b7d6b;
            --deep-earth: #5a4a3a;
            --gentle-green: #a8b5a0;
            --accent: #d4a574;
            --blue: #6B9BD1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Public Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-gray) 100%);
            min-height: 100vh;
            color: var(--deep-earth);
        }

        /* Navigation */
        nav {
            background: white;
            padding: 1rem 2rem;
            box-shadow: 0 2px 8px rgba(90, 74, 58, 0.1);
            margin-bottom: 2rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        nav a {
            text-decoration: none;
            color: var(--deep-earth);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: var(--warm-gray);
        }

        nav a.active {
            background: var(--blue);
            color: white;
        }

        /* Main content wrapper */
        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            min-height: calc(100vh - 100px);
        }

        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(90, 74, 58, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 2.5rem;
            font-weight: 300;
            color: var(--deep-earth);
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .prompt-section {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            border: 3px solid #6B9BD1;
        }

        .prompt-label {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--soft-brown);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .prompt-text {
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            color: var(--deep-earth);
            line-height: 1.6;
        }

        .prompt-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid transparent;
            border-radius: 12px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            color: var(--deep-earth);
            background: white;
            transition: border-color 0.3s ease;
        }

        .prompt-input:focus {
            outline: none;
            border-color: var(--gentle-green);
        }

        .prompt-input::placeholder {
            color: var(--soft-brown);
            opacity: 0.6;
        }

        .prompt-loading {
            color: var(--soft-brown);
            font-style: italic;
        }

        .timer-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .timer {
            font-family: 'Crimson Pro', serif;
            font-size: 4rem;
            font-weight: 300;
            color: var(--deep-earth);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .timer.warning {
            color: var(--accent);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .start-button {
            background: #6B9BD1;
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Public Sans', sans-serif;
            letter-spacing: 0.5px;
        }

        .start-button:hover {
            background: #5588c4;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(107, 155, 209, 0.4);
        }

        .start-button:disabled {
            background: var(--warm-gray);
            color: var(--soft-brown);
            cursor: not-allowed;
            transform: none;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 1.5rem;
            border: 3px solid #6B9BD1;
            border-radius: 16px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--deep-earth);
            resize: vertical;
            transition: border-color 0.3s ease;
            background: white;
        }

        textarea:focus {
            outline: none;
            border-color: #5588c4;
        }

        textarea:disabled {
            background: white;
            cursor: not-allowed;
        }

        .word-count {
            text-align: right;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--soft-brown);
        }

        .download-section {
            margin-top: 2rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .download-section.visible {
            opacity: 1;
        }

        .download-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Public Sans', sans-serif;
        }

        .download-button:hover {
            background: var(--soft-brown);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(212, 165, 116, 0.4);
        }

        .complete-message {
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            color: var(--gentle-green);
            margin-bottom: 1rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .timer {
                font-size: 3rem;
            }

            nav ul {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Archive page styles */
        .archive-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 3rem;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(90, 74, 58, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .archive-item {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            border: 3px solid var(--blue);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .archive-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(107, 155, 209, 0.2);
        }

        .archive-date {
            font-family: 'Crimson Pro', serif;
            font-size: 1.25rem;
            color: var(--deep-earth);
            margin-bottom: 0.5rem;
        }

        .archive-prompt {
            color: var(--soft-brown);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .archive-preview {
            color: var(--deep-earth);
            font-size: 0.95rem;
            line-height: 1.6;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .archive-actions {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }

        .archive-btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn {
            background: var(--blue);
            color: white;
        }

        .view-btn:hover {
            background: #5588c4;
        }

        .delete-btn {
            background: var(--warm-gray);
            color: var(--soft-brown);
        }

        .delete-btn:hover {
            background: #d4a574;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--soft-brown);
        }

        .empty-state h2 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--soft-brown);
        }

        .modal-text {
            font-family: 'Crimson Pro', serif;
            font-size: 1.125rem;
            line-height: 1.8;
            color: var(--deep-earth);
            white-space: pre-wrap;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#" class="nav-link active" data-page="write">Write</a></li>
            <li><a href="#" class="nav-link" data-page="archive">My Writings</a></li>
        </ul>
    </nav>

    <!-- Write Page -->
    <div class="main-content">
        <div id="writePage" class="page active">
            <div class="container">
        <h1>Let's write for 10 minutes today</h1>
        
        <div class="prompt-section">
            <div class="prompt-label">Today's Writing Prompt</div>
            <input 
                type="text" 
                id="promptInput" 
                class="prompt-input" 
                placeholder="Paste today's prompt here..."
            />
        </div>

        <div class="timer-section">
            <div class="timer" id="timer">10:00</div>
            <button class="start-button" id="startButton">Start Writing</button>
        </div>

        <textarea 
            id="writingArea" 
            placeholder="Start writing here..."
            disabled
        ></textarea>
        <div class="word-count" id="wordCount">0 / 5000 words</div>

        <div class="download-section" id="downloadSection">
            <div class="complete-message">Time's up! Great work today.</div>
            <button class="download-button" id="downloadButton">Download Your Writing</button>
        </div>
    </div>
        </div>
    </div>

    <!-- Archive Page -->
    <div class="main-content">
        <div id="archivePage" class="page">
            <div class="archive-container">
                <h1>My Writings</h1>
                <div id="archiveList" class="archive-list"></div>
            </div>
        </div>
    </div>

    <!-- Modal for viewing full text -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalDate"></h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <p id="modalPrompt" style="color: var(--soft-brown); margin-bottom: 1rem;"></p>
            <div id="modalText" class="modal-text"></div>
        </div>
    </div>

    <script>
        let timeRemaining = 600; // 10 minutes in seconds
        let timerInterval = null;
        let isTimerRunning = false;

        const startButton = document.getElementById('startButton');
        const writingArea = document.getElementById('writingArea');
        const timerDisplay = document.getElementById('timer');
        const wordCount = document.getElementById('wordCount');
        const downloadSection = document.getElementById('downloadSection');
        const downloadButton = document.getElementById('downloadButton');
        const promptInput = document.getElementById('promptInput');

        // Navigation
        const navLinks = document.querySelectorAll('.nav-link');
        const pages = document.querySelectorAll('.page');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const pageName = link.dataset.page;
                
                // Update active nav link
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                
                // Show correct page
                pages.forEach(p => p.classList.remove('active'));
                if (pageName === 'write') {
                    document.getElementById('writePage').classList.add('active');
                } else if (pageName === 'archive') {
                    document.getElementById('archivePage').classList.add('active');
                    loadArchive();
                }
            });
        });

        // Storage functions
        function saveWriting() {
            const writings = JSON.parse(localStorage.getItem('writings') || '[]');
            const newWriting = {
                id: Date.now(),
                date: new Date().toLocaleDateString('en-GB', { 
                    day: 'numeric', 
                    month: 'long', 
                    year: 'numeric' 
                }),
                prompt: promptInput.value,
                text: writingArea.value,
                timestamp: Date.now()
            };
            writings.unshift(newWriting); // Add to beginning
            localStorage.setItem('writings', JSON.stringify(writings));
        }

        function loadArchive() {
            const writings = JSON.parse(localStorage.getItem('writings') || '[]');
            const archiveList = document.getElementById('archiveList');
            
            if (writings.length === 0) {
                archiveList.innerHTML = `
                    <div class="empty-state">
                        <h2>No writings yet</h2>
                        <p>Your completed writing sessions will appear here.</p>
                    </div>
                `;
                return;
            }

            archiveList.innerHTML = writings.map(writing => {
                const preview = writing.text.substring(0, 150) + (writing.text.length > 150 ? '...' : '');
                const words = writing.text.trim().split(/\s+/).length;
                
                return `
                    <div class="archive-item" data-id="${writing.id}">
                        <div class="archive-date">${writing.date}</div>
                        <div class="archive-prompt">Prompt: ${writing.prompt || 'No prompt'}</div>
                        <div class="archive-preview">${preview}</div>
                        <div style="color: var(--soft-brown); font-size: 0.85rem; margin-top: 0.5rem;">${words} words</div>
                        <div class="archive-actions">
                            <button class="archive-btn view-btn" onclick="viewWriting(${writing.id})">View</button>
                            <button class="archive-btn delete-btn" onclick="deleteWriting(${writing.id})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.viewWriting = function(id) {
            const writings = JSON.parse(localStorage.getItem('writings') || '[]');
            const writing = writings.find(w => w.id === id);
            
            if (writing) {
                document.getElementById('modalDate').textContent = writing.date;
                document.getElementById('modalPrompt').textContent = `Prompt: ${writing.prompt || 'No prompt'}`;
                document.getElementById('modalText').textContent = writing.text;
                document.getElementById('viewModal').classList.add('active');
            }
        };

        window.deleteWriting = function(id) {
            if (confirm('Are you sure you want to delete this writing?')) {
                let writings = JSON.parse(localStorage.getItem('writings') || '[]');
                writings = writings.filter(w => w.id !== id);
                localStorage.setItem('writings', JSON.stringify(writings));
                loadArchive();
            }
        };

        // Modal close
        document.getElementById('modalClose').addEventListener('click', () => {
            document.getElementById('viewModal').classList.remove('active');
        });

        document.getElementById('viewModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewModal') {
                document.getElementById('viewModal').classList.remove('active');
            }
        });

        // Update timer display
        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            // Add warning class in last minute
            if (timeRemaining <= 60) {
                timerDisplay.classList.add('warning');
            }
        }

        // Update word count
        writingArea.addEventListener('input', () => {
            const text = writingArea.value.trim();
            const words = text === '' ? 0 : text.split(/\s+/).length;
            wordCount.textContent = `${words} / 5000 words`;
            
            // Enforce 5000 word limit
            if (words > 5000) {
                const wordsArray = text.split(/\s+/);
                writingArea.value = wordsArray.slice(0, 5000).join(' ');
                wordCount.textContent = `5000 / 5000 words`;
            }
        });

        // Start timer
        function startTimer() {
            if (isTimerRunning) return;
            
            isTimerRunning = true;
            startButton.disabled = true;
            writingArea.disabled = false;
            writingArea.focus();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    endWritingSession();
                }
            }, 1000);
        }

        // End writing session
        function endWritingSession() {
            clearInterval(timerInterval);
            writingArea.disabled = true;
            downloadSection.classList.add('visible');
            timerDisplay.textContent = '0:00';
            
            // Save writing to storage
            if (writingArea.value.trim().length > 0) {
                saveWriting();
            }
        }

        // Update word count
        writingArea.addEventListener('input', () => {
            const length = writingArea.value.length;
            wordCount.textContent = `${length} / 2000 characters`;
        });

        // Start button
        startButton.addEventListener('click', startTimer);

        // Download functionality
        downloadButton.addEventListener('click', () => {
            const text = writingArea.value;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const date = new Date().toISOString().split('T')[0];
            a.href = url;
            a.download = `writing-${date}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
